[project]
name = "halyk-covenant-agent"
version = "0.1.0"
description = "Halyk AI Challenge — covenant compliance agent (agentic pipeline over loan documents + ledger)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "pymupdf>=1.24",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "anthropic>=0.69",
  "openai>=1.40",  # OpenAI-compatible client for local LM Studio runs
  "rich>=13.7",  # TTY progress dashboard for battle-day observability; no HITL
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "textual>=1.0",  # tools/dev.py only — dev triage browser, never imported by agent.run
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools"]
